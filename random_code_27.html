<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Click Challenge</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #243b6b, #050814);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f7ff;
    }
    h1 {
      margin-bottom: 4px;
    }
    p {
      margin-top: 0;
      opacity: 0.8;
    }
    #arena {
      position: relative;
      width: 320px;
      height: 320px;
      margin-top: 16px;
      border-radius: 24px;
      background: rgba(10, 16, 32, 0.9);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    #dot {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: #3ba6ff;
      box-shadow: 0 0 0 6px rgba(59, 166, 255, 0.35);
      cursor: pointer;
      display: none;
    }
    #stats {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      font-size: 14px;
      opacity: 0.9;
    }
    button {
      margin-top: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #49d18f;
      color: #041219;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(7, 189, 116, 0.4);
    }
    button:hover {
      background: #37b476;
    }
  </style>
</head>
<body>
  <h1>Random Click Challenge</h1>
  <p>Click the glowing dot as many times as you can in 15 seconds.</p>

  <div id="arena">
    <div id="dot"></div>
  </div>

  <div id="stats">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
    <div>Time: <span id="time">15</span>s</div>
  </div>

  <button id="start">Start</button>

  <script>
    const arena = document.getElementById("arena");
    const dot = document.getElementById("dot");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const timeEl = document.getElementById("time");
    const startBtn = document.getElementById("start");

    let score = 0;
    let best = Number(localStorage.getItem("randomClickBest") || 0);
    let timeLeft = 15;
    let timerId = null;
    let playing = false;

    bestEl.textContent = best;

    function randomPos() {
      const rect = arena.getBoundingClientRect();
      const size = 32;
      const x = Math.random() * (rect.width - size);
      const y = Math.random() * (rect.height - size);
      dot.style.transform = `translate(${x}px, ${y}px)`;
    }

    function tick() {
      timeLeft -= 1;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }

    function startGame() {
      if (playing) return;
      playing = true;
      score = 0;
      scoreEl.textContent = "0";
      timeLeft = 15;
      timeEl.textContent = timeLeft;
      startBtn.textContent = "Playing...";
      startBtn.disabled = true;
      dot.style.display = "block";
      randomPos();
      timerId = setInterval(tick, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(timerId);
      dot.style.display = "none";
      startBtn.textContent = "Play Again";
      startBtn.disabled = false;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("randomClickBest", String(best));
        alert("New high score: " + score + "!");
      }
    }

    dot.addEventListener("click", () => {
      if (!playing) return;
      score += 1;
      scoreEl.textContent = score;
      randomPos();
    });

    startBtn.addEventListener("click", startGame);
  </script>
</body>
</html>

# Random Code Generator Configuration
# YAML configuration file example

application:
  name: "Random Code Generator"
  version: "1.0.0"
  description: "Generates random alphanumeric codes"

generator:
  default_length: 12
  character_set: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  codes_to_generate: 5
  
  settings:
    use_uppercase: true
    use_lowercase: true
    use_numbers: true
    use_special_chars: false

output:
  format: "Code #{index}: {code}"
  include_timestamp: true
  timestamp_format: "YYYY-MM-DD HH:mm:ss"

logging:
  level: "INFO"
  file: "random_codes.log"

metadata:
  created_at: "2024-01-01 00:00:00"
  author: "Random Code Generator"
  language: "YAML"

